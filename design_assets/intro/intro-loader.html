<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0d"><meta name="color-scheme" content="dark"><title>Flicks – intro & loading screen</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;--out:cubic-bezier(.23,1,.32,1);--io:cubic-bezier(.77,0,.175,1);--back:cubic-bezier(.34,1.56,.64,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%}
body{margin:0;background:var(--bg);color:#fff;font:500 1rem/1.4 Outfit,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;color:rgba(255,255,255,.66);text-align:center}
.replay{font:inherit;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:10px 20px;cursor:pointer;transition:transform .16s var(--out),background-color .16s ease}
.replay:active{transform:scale(.97)}.replay:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media(hover:hover) and (pointer:fine){.replay:hover{background:rgba(255,255,255,.1)}}
.splash{position:fixed;inset:0;z-index:1;display:grid;place-items:center;background:var(--bg);overflow:hidden;clip-path:circle(150% at 50% 44%)}
.splash[hidden]{display:none}.splash:not(.go) .stage{visibility:hidden}
.glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent)}
.g1{--c:rgba(66,133,244,.34);left:-28vmax;top:-34vmax}.g2{--c:rgba(234,67,53,.28);right:-34vmax;bottom:-38vmax}.g3{--c:rgba(251,188,4,.2);left:-40vmax;bottom:-46vmax}.g4{--c:rgba(52,168,83,.22);right:-26vmax;top:-48vmax}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px}
.logo{width:min(62vw,340px);height:auto;display:block;overflow:visible;fill:#fff}
.logo g,.logo path{transform-box:fill-box;transform-origin:center}.logo .cloud{transform-box:view-box;transform-origin:650px 1000px}.logo .st{transform-origin:50% 100%}
.ray:nth-child(4n+1){fill:var(--blue)}.ray:nth-child(4n+2){fill:var(--red)}.ray:nth-child(4n+3){fill:var(--yellow)}.ray:nth-child(4n){fill:var(--green)}
.sp:nth-child(1){fill:var(--yellow)}.sp:nth-child(2){fill:var(--blue)}.st:nth-child(1){fill:var(--blue)}.st:nth-child(2){fill:var(--yellow)}.st:nth-child(3){fill:var(--green)}.lens{fill:var(--red)}
.word{display:flex;margin:0;font-weight:700;font-size:clamp(2.4rem,11vw,3.6rem);letter-spacing:-.025em;line-height:1}.word span{display:inline-block}
.ui{display:grid;gap:10px;width:min(72vw,300px);font-size:.875rem;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.fill{height:100%;transform:translateX(-100%);background:linear-gradient(90deg,var(--blue) 25%,var(--red) 0 50%,var(--yellow) 0 75%,var(--green) 0)}
.meta{display:flex;justify-content:space-between}
.go .glow{animation:fade 1.4s ease .1s both,drift 9s ease-in-out infinite alternate}
.go .cloud{animation:pop .95s var(--out) .15s both}.go .horn{animation:horn .6s var(--out) .85s both}
.go .lens{animation:lens .55s var(--back) 1.05s both}.go .lens path{animation:rec 1.8s ease-in-out 1.7s infinite}
.go .gl{animation:glint .6s var(--out) calc(1.15s + var(--i)*.08s) both}
.go .ray{animation:ray .55s var(--out) calc(1.1s + var(--i)*.05s) both}
.go .sp{animation:spark .7s var(--back) calc(1.3s + var(--i)*.14s) both}.go .tw{animation:twinkle 1.6s ease-in-out calc(2.1s + var(--i)*.5s) infinite}
.go .st{animation:rise .85s var(--out) calc(1.35s + var(--i)*.12s) both}.go .wv{animation:wave 2.2s ease-in-out calc(2.2s + var(--i)*.35s) infinite alternate}
.go .logo{animation:float 4s ease-in-out 2.2s infinite alternate}
.go .word span{animation:letter .65s var(--back) calc(1.75s + var(--i)*.055s) both}.go .ui{animation:fade .5s var(--out) 2.2s both}
.splash.out{animation:iris .7s var(--io) both}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fadeout{to{opacity:0}}
@keyframes drift{to{transform:translate(4vmax,3vmax)}}
@keyframes pop{0%{opacity:0;transform:translateY(7%) scale(.78,.62)}35%{opacity:1;transform:translateY(-3%) scale(.97,1.09)}65%{transform:scale(1.04,.96)}100%{opacity:1;transform:none}}
@keyframes horn{from{opacity:0;transform:translateX(-110px)}to{opacity:1;transform:none}}
@keyframes lens{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes rec{50%{opacity:.45}}
@keyframes glint{from{opacity:0;transform:translate(-18px,14px)}to{opacity:.95;transform:none}}
@keyframes ray{from{opacity:0;transform:translate(calc(var(--dx)*-1px),calc(var(--dy)*-1px)) scale(.6)}to{opacity:1;transform:none}}
@keyframes spark{from{opacity:0;transform:rotate(-120deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes twinkle{50%{opacity:.55;transform:scale(.82) rotate(20deg)}}
@keyframes rise{from{opacity:0;transform:translateY(70px) scale(.9,.7)}to{opacity:1;transform:none}}
@keyframes wave{to{transform:translateY(-14px) scaleY(1.05)}}
@keyframes float{to{transform:translateY(-8px)}}
@keyframes letter{from{opacity:0;transform:translateY(55%) scale(.9)}to{opacity:1;transform:none}}
@keyframes iris{from{clip-path:circle(150% at 50% 44%)}to{clip-path:circle(0% at 50% 44%)}}
@media(prefers-reduced-motion:reduce){
.go .cloud,.go .horn,.go .lens,.go .gl,.go .ray,.go .sp,.go .st,.go .word span{animation-name:fade;animation-timing-function:ease}
.go .glow{animation:fade 1s ease both}.go .lens path,.go .tw,.go .wv,.go .logo{animation:none}
.splash.out{animation:fadeout .4s ease both}}
</style></head><body>

<div class="ui"><div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div></div><div class="meta"><span id="msg" role="status"></span><span id="pct">0%</span></div></div>

<script>
(()=>{
const NAME='Flicks'; /* ← your app name */
const $=s=>document.querySelector(s),sp=$('#splash'),fill=$('#fill'),pct=$('#pct'),msg=$('#msg'),bar=$('#bar'),word=$('#word');
word.setAttribute('aria-label',NAME);word.innerHTML=[...NAME].map((c,i)=>`<span aria-hidden="true" style="--i:${i}">${c}</span>`).join('');
const LEAD=1600,RUN=2800,STEPS=[[0,'Warming up'],[40,'Connecting to your library'],[85,'Almost showtime']];
let t0,shown,target,auto,raf,done,last;
function frame(now){
 t0=t0||now;if(auto)target=Math.max(0,Math.min(100,(now-t0-LEAD)/RUN*100));
 shown+=(target-shown)*.14;if(target-shown<.05)shown=target;
 fill.style.transform=`translateX(${shown-100}%)`;
 const v=Math.round(shown),m=STEPS.filter(s=>shown>=s[0]).pop()[1];
 pct.textContent=v+'%';bar.setAttribute('aria-valuenow',v);if(m!==last)msg.textContent=last=m;
 if(shown>=100&&!done){done=1;setTimeout(exit,400);return}
 raf=requestAnimationFrame(frame)}
function exit(){sp.classList.add('out');sp.addEventListener('animationend',function h(e){if(e.target!==sp)return;sp.removeEventListener('animationend',h);sp.hidden=true;document.dispatchEvent(new Event('splash:done'))})}
function start(){cancelAnimationFrame(raf);sp.hidden=false;sp.className='splash';void sp.offsetWidth;sp.classList.add('go');t0=0;shown=target=0;auto=true;done=0;last='';raf=requestAnimationFrame(frame)}
$('#replay').onclick=start;
/* real loading: Splash.progress(0-100) as assets/torrent metadata load, then Splash.finish() */
window.Splash={progress(n){auto=false;target=Math.max(target,Math.min(100,n))},finish(){auto=false;target=100},replay:start};
start();
})();
