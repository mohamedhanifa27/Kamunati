<style>
:root{--bg:#07050f;--v1:#6d28d9;--v2:#8b5cf6;--v3:#a78bfa;--v4:#c084fc;--v5:#7c9cff;--text:#ece8ff;--muted:#9a8fc4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans","Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:grid;place-content:center;gap:18px;text-align:center}
#app h1{margin:0;font-size:clamp(22px,5vw,34px)}
#app p{margin:0;color:var(--muted)}
#app button{justify-self:center;border:0;border-radius:999px;padding:12px 26px;font:700 15px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--v1),var(--v4))}
.splash{position:fixed;inset:0;z-index:9;display:grid;grid-template-rows:1fr auto;justify-items:center;background:var(--bg);overflow:hidden;padding:env(safe-area-inset-top,0px) 24px calc(env(safe-area-inset-bottom,0px) + 36px);clip-path:circle(150% at 50% 45%)}
.splash.exit{clip-path:circle(0% at 50% 45%);transition:clip-path .9s cubic-bezier(.7,0,.3,1) .15s;pointer-events:none}
.exit .stage,.exit .load{opacity:0;transform:scale(1.18);transition:.6s ease}
.bg{position:absolute;inset:0;overflow:hidden}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 25%,rgba(7,5,15,.8) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.36}
.b1{width:70vmax;height:70vmax;left:-20vmax;top:-26vmax;background:var(--v1);animation:d1 11s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-22vmax;bottom:-22vmax;background:var(--v4);opacity:.26;animation:d2 13s ease-in-out infinite alternate}
.b3{width:44vmax;height:44vmax;left:28%;top:34%;background:var(--v5);opacity:.16;animation:d1 9s ease-in-out infinite alternate-reverse}
.stage{position:relative;align-self:center;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vh,24px)}
.logo{position:relative;width:min(62vw,330px);aspect-ratio:1;animation:logoin 1s both,bob 5s 2.4s ease-in-out infinite alternate}
.logo svg{position:relative;width:100%;height:100%;overflow:visible}
.aura{position:absolute;inset:-28%;border-radius:50%;background:conic-gradient(var(--v1),var(--v4),var(--v5),var(--v2),var(--v1));filter:blur(70px);opacity:0;animation:aura 1.6s 1.3s forwards,spin 9s linear infinite}
.logo path{transform-box:fill-box;transform-origin:center}
.body{fill-opacity:0;stroke:url(#vg);stroke-width:7;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .25s cubic-bezier(.65,0,.35,1) forwards,fillin .8s 1.25s ease forwards}
.dot{animation:pop .5s 1.7s both,pulse 1.8s 2.3s ease-in-out infinite alternate}
.ray{animation:burst .6s calc(1.9s + var(--i)*.06s) cubic-bezier(.2,.9,.3,1) both,shim 2.2s calc(2.8s + var(--i)*.17s) ease-in-out infinite alternate}
.steam{animation:fade .8s calc(1.9s + var(--i)*.2s) both,float 2.6s calc(2.8s + var(--i)*.35s) ease-in-out infinite alternate}
.spark{animation:pop .6s calc(2.2s + var(--i)*.2s) both,twinkle 2.4s calc(3s + var(--i)*.6s) ease-in-out infinite}
.glint{animation:fade .7s 1.8s both}
.word{display:flex;margin:0;font-weight:800;font-size:clamp(26px,8vw,44px);letter-spacing:.3em;margin-right:-.3em}
.word span{background:linear-gradient(90deg,#c4b5fd,#8b5cf6,#c084fc,#7c9cff,#c4b5fd);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s calc(2.4s + var(--i)*.07s) cubic-bezier(.2,.8,.2,1) both,flow 5s linear infinite;animation-delay:calc(2.4s + var(--i)*.07s),calc(var(--i)*-.45s)}
.tag{margin:0;color:var(--muted);font-size:clamp(12px,3.2vw,14px);letter-spacing:.08em;animation:fade 1s 3.2s both}
.load{position:relative;width:min(86vw,420px);animation:fade .8s 2.6s both}
.row,.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.row{margin-bottom:10px;color:var(--text);font-weight:500}
#pct{font-variant-numeric:tabular-nums;font-weight:700}
.track{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#fill{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;border-radius:4px;background:linear-gradient(90deg,var(--v1),var(--v3),var(--v4),var(--v5),var(--v3));background-size:200% 100%;box-shadow:0 0 14px var(--v2);animation:flow 2.2s linear infinite;transition:transform .25s linear}
.meta{margin-top:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.meta b{color:var(--v3);font-variant-numeric:tabular-nums}
@keyframes d1{to{transform:translate(18vmax,14vmax) scale(1.25)}}
@keyframes d2{to{transform:translate(-16vmax,-12vmax) scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes aura{to{opacity:.4}}
@keyframes logoin{from{opacity:0;transform:scale(.86)}}
@keyframes bob{to{transform:translateY(-8px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-width:0}}
@keyframes pop{from{transform:scale(0);opacity:0}60%{transform:scale(1.25)}to{transform:scale(1);opacity:1}}
@keyframes pulse{to{transform:scale(1.14)}}
@keyframes burst{from{transform:translate(calc(var(--dx)*-1),calc(var(--dy)*-1)) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes shim{to{opacity:.4}}
@keyframes fade{from{opacity:0}}
@keyframes float{to{transform:translateY(-16px);opacity:.55}}
@keyframes twinkle{50%{transform:scale(.5) rotate(45deg);opacity:.55}}
@keyframes rise{from{transform:translateY(.5em);opacity:0;filter:blur(6px)}}
@keyframes flow{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
